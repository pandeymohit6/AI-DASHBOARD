services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-staywise}
      POSTGRES_USER: ${POSTGRES_USER:-staywise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staywise} -d ${POSTGRES_DB:-staywise}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://staywise:123@db:5432/staywise}
      JWT_SECRET: ${JWT_SECRET:abcd123456}
      PORT: 4000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    build: ./apps/web
    environment:
      VITE_API_URL: http://localhost:4000
    ports: ["5173:5173"]
    depends_on: [api]
volumes:
  pgdata:
